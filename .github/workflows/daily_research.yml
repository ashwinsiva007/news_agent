name: Daily Morning Research Pipeline

on:
  schedule:
    # 7:00 AM IST (UTC+5:30) is 1:30 AM UTC (01:30 UTC)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  research:
    name: Run AI Morning Research Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Research Pipeline
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python research.py --schedule --lookback 24

      - name: Commit and Push Updated Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/
          # Check if there are changes before committing
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "chore(brief): update morning research brief for $(date -u +'%Y-%m-%d')"
            git push
          fi
